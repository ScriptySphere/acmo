<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* --- কালার থিম আপডেট (Blue থেকে Red/Orange) --- */
        :root {
            --primary-color: #dc2626; /* Crimson Red */
            --primary-dark: #991b1b;
            --accent-color: #f59e0b; /* Orange/Gold */
            --bg-light: #f8fafc;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding: 15px 20px 20px;
            background: #fff;
            border-top: 1px solid #f1f5f9;
        }

        .btn-view {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            text-transform: uppercase;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 38, 38, 0.3);
            background: linear-gradient(135deg, var(--primary-dark) 0%, #7f1d1d 100%);
        }

        .btn-share {
            background: #f8fafc;
            color: #64748b;
            border: 1.5px solid #e2e8f0;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-share:hover {
            background: #fff;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* --- Full Page Profile Modal --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: var(--bg-light);
            overflow-y: auto;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content {
            background: transparent;
            margin: 0 auto;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            position: relative;
        }

        .close-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            font-size: 20px;
            color: #fff;
            background: var(--primary-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
        }

        .modal-header-bg {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            height: 200px;
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .modal-body {
            padding: 0 20px 50px;
            margin-top: -80px;
            text-align: center;
        }

        .modal-photo {
            width: 160px;
            height: 160px;
            border-radius: 25px;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .info-card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .info-card label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .info-card span {
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card i { color: var(--primary-color); }

        .detail-box {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .achievement-box {
            background: #fff8f1; /* Light Orange Tint */
            border: 1px dashed var(--accent-color);
        }

        .download-btn {
            background: #15803d;
            color: #fff !important;
            padding: 16px;
            border-radius: 12px;
            margin-top: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        #shareModal {
            display: none;
            position: fixed;
            z-index: 10002;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .share-content {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i><p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)"><i class="fas fa-map-location-dot"></i><p>Divisional</p></div>
        <div class="icon-btn" onclick="fetchMembers('district_members.json', this)"><i class="fas fa-city"></i><p>District</p></div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)"><i class="fas fa-building"></i><p>Upazila</p></div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3 style="margin-bottom:15px; color:#1e293b;">Share Profile</h3>
            <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:15px;"></div>
            <div class="copy-link-box" style="display:flex; background:#f1f5f9; padding:6px; border-radius:10px;">
                <input type="text" id="shareLinkInput" readonly style="border:none; background:transparent; width:100%; padding:5px; font-size:12px; outline:none;">
                <button onclick="copyLink()" class="copy-btn" style="background:#1e293b; color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Copy</button>
            </div>
            <button onclick="closeShare()" style="margin-top:20px; border:none; background:none; color:#64748b; cursor:pointer; font-weight:600;">Close</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column:1/-1; padding:50px;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header" style="background: var(--primary-dark)">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag" style="background: rgba(220,38,38,0.1); color: var(--primary-color);">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation" style="color:var(--primary-color)">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Profile</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 15px 0 5px; font-size: 26px; color:#1e293b;">${m.name}</h2>
                <p style="color:var(--primary-color); font-weight:700; margin-bottom:20px;">${m.designation}</p>
                
                <div class="info-grid">
                    <div class="info-card"><label>সংগঠনের আইডি নম্বর</label><span><i class="fas fa-id-badge"></i> ${m.id}</span></div>
                    <div class="info-card"><label>রক্তের গ্রুপ</label><span><i class="fas fa-tint" style="color:#ef4444;"></i> ${m.bloodGroup}</span></div>
                    <div class="info-card"><label>ফোন নম্বর</label><span><i class="fas fa-phone"></i> ${m.phone || 'N/A'}</span></div>
                    <div class="info-card"><label>যোগদানের তারিখ</label><span><i class="fas fa-calendar-check"></i> ${m.joiningDate || 'N/A'}</span></div>
                </div>

                <div class="info-grid" style="margin-top:15px;">
                    <div class="info-card"><label>ইমেইল এড্রেস</label><span><i class="fas fa-envelope"></i> ${m.email || 'N/A'}</span></div>
                    <div class="info-card"><label>পেশাগত পরিচয়</label><span><i class="fas fa-user-tie"></i> ${m.profession || 'N/A'}</span></div>
                </div>

                <div class="detail-box">
                    <h4 style="margin:0 0 10px; color:var(--primary-dark);"><i class="fas fa-laptop-code"></i> Skills</h4>
                    <p style="font-size:14px; color:#475569; margin:0;">${m.skills || 'কোনো স্কিল যুক্ত করা হয়নি।'}</p>
                </div>

                <div class="detail-box achievement-box">
                    <h4 style="margin:0 0 10px; color:#b45309;"><i class="fas fa-award"></i> অর্জিত সাফল্য (Achievements)</h4>
                    <p style="font-size:14px; color:#475569; margin:0;">${m.achievements || 'এখনো কোনো অর্জন যুক্ত করা হয়নি।'}</p>
                </div>

                <div class="detail-box">
                    <h4 style="margin:0 0 10px; color:var(--primary-dark);"><i class="fas fa-quote-left"></i> সংক্ষিপ্ত বায়ো</h4>
                    <p style="font-size:14px; color:#475569; line-height:1.6; margin:0;">${m.bio || 'সদস্য সম্পর্কে তথ্য নেই।'}</p>
                </div>

                <button class="download-btn" onclick="alert('Digital ID Card generate হচ্ছে...')">
                    <i class="fas fa-download"></i> DOWNLOAD IDENTITY CARD
                </button>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        function openShare(id) {
            const shareUrl = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: shareUrl, width: 140, height: 140 });
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Link Copied!");
        }

        function closeShare() { document.getElementById('shareModal').style.display = "none"; }

        // URL চেক করে অটো প্রোফাইল ওপেন করা (শেয়ার লিংকের জন্য)
        window.onload = () => {
            fetchMembers('central_members.json', document.querySelector('.icon-btn'));
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');
            if (memberId) {
                setTimeout(() => {
                    const index = currentMembers.findIndex(m => m.id === memberId);
                    if (index !== -1) openModal(index);
                }, 1000);
            }
        };
    </script>
</body>
</html>
