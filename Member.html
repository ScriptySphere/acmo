<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* --- Menu Toggle Custom CSS --- */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }
        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: #fff;
            border-radius: 5px;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .nav-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: #007bff;
                padding: 20px;
                text-align: center;
                z-index: 1000;
            }
            .nav-menu.active { display: flex; }
        }

        /* --- Improved Profile Modal Styling --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: #f0f2f5;
            overflow-y: auto;
        }
        .modal-content {
            background: transparent;
            margin: 0 auto;
            width: 100%;
            max-width: 500px;
            position: relative;
            min-height: 100vh;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .close-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            font-size: 20px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2100;
        }

        .modal-header-bg {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 200px;
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
        .modal-body {
            padding: 0 20px 40px 20px;
            text-align: center;
            margin-top: -90px;
        }
        .modal-photo {
            width: 160px;
            height: 160px;
            border-radius: 40px;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: #fff;
        }

        .profile-card {
            background: #fff;
            border-radius: 30px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
            text-align: left;
        }
        .info-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #f1f5f9;
        }
        .info-box label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
        }
        .info-box span {
            font-size: 14px;
            color: #1e293b;
            font-weight: 700;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            margin-top: 25px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            border: none;
            width: 100%;
            cursor: pointer;
        }

        /* Card Section */
        .card-actions {
            display: flex;
            gap: 8px;
            padding: 12px;
        }
        .btn-view { flex: 1; background: #007bff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 10px; }
        .btn-share { background: #f1f5f9; color: #64748b; border: none; border-radius: 8px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal" style="display:none; position:fixed; z-index:3000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
        <div style="background:#fff; padding:30px; border-radius:25px; text-align:center; width:300px;">
            <h3>Profile QR Code</h3>
            <div id="qrcode" style="margin:20px auto; display:flex; justify-content:center;"></div>
            <button onclick="closeShare()" class="btn-view" style="width:100%;">Close</button>
        </div>
    </div>

    <script>
        // --- Navbar Toggle Logic ---
        function toggleMenu() {
            document.getElementById('nav-menu').classList.toggle('active');
        }

        let currentMembers = [];

        function fetchMembers(file, btn) {
            const list = document.getElementById('memberList');
            fetch(file).then(res => res.json()).then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card" style="background:#fff; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.05); margin:10px; overflow:hidden;">
                            <div style="padding:20px; text-align:center;">
                                <img src="${m.photo}" style="width:100px; height:100px; border-radius:50%; object-fit:cover;" onerror="this.src='assets/images/logo.png'">
                                <h3 style="margin-top:10px;">${m.name}</h3>
                                <p style="color:#007bff; font-size:13px;">${m.designation}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Profile</button>
                                <button class="btn-share" onclick="openShare('${m.id}')"><i class="fas fa-qrcode"></i></button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <div class="profile-card">
                    <h2 style="color:#1e293b; margin-bottom:5px;">${m.name}</h2>
                    <p style="color:#007bff; font-weight:bold;">${m.designation}</p>
                    <div class="info-grid">
                        <div class="info-box"><label>ID NO</label><span>${m.id}</span></div>
                        <div class="info-box"><label>BLOOD</label><span style="color:red;">${m.bloodGroup}</span></div>
                        <div class="info-box"><label>PROFESSION</label><span>${m.profession || 'N/A'}</span></div>
                        <div class="info-box"><label>JOINING</label><span>${m.joiningDate || 'N/A'}</span></div>
                    </div>
                </div>
                <div style="background:#fff; padding:20px; border-radius:20px; margin-top:15px; text-align:left; box-shadow:0 5px 15px rgba(0,0,0,0.03);">
                    <h4 style="color:#64748b; margin-bottom:8px;">Bio</h4>
                    <p style="font-size:14px; color:#475569;">${m.bio || 'বিস্তারিত তথ্য নেই।'}</p>
                </div>
                <button class="download-btn" onclick="alert('Downloading ID Card...')">
                    <i class="fas fa-id-card"></i> DOWNLOAD ID CARD
                </button>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        function openShare(id) {
            const shareUrl = window.location.origin + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: shareUrl, width: 150, height: 150 });
        }
        function closeShare() { document.getElementById('shareModal').style.display = "none"; }

        window.onload = () => fetchMembers('central_members.json');
    </script>
</body>
</html>
