<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Existing Styles + New Card Buttons */
        :root { --primary: #007bff; --secondary: #6c757d; }
        .member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .member-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; border: 1px solid #eee; }
        .card-actions { display: flex; border-top: 1px solid #eee; }
        .btn-action { flex: 1; padding: 12px; border: none; cursor: pointer; background: #fff; font-size: 14px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-details { color: var(--primary); border-right: 1px solid #eee; }
        .btn-share { color: var(--secondary); }
        .btn-action:hover { background: #f8f9fa; }

        /* Modal Enhancements */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); overflow-y: auto; }
        .modal-content { background: #fff; margin: 20px auto; border-radius: 20px; width: 90%; max-width: 450px; position: relative; }
        .id-card-view { padding: 20px; text-align: center; } /* This part will be captured as image */
        
        .modal-footer { padding: 15px; display: flex; gap: 10px; justify-content: center; background: #f1f1f1; border-radius: 0 0 20px 20px; }
        .btn-download { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        
        /* Share Modal */
        #shareSection { text-align: center; padding: 20px; display: none; border-top: 1px dotted #ccc; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span style="position:absolute; right:15px; top:10px; font-size:30px; cursor:pointer; z-index:100;" onclick="closeModal()">&times;</span>
            
            <div id="captureArea" class="id-card-view">
                <div style="background: var(--primary); height:80px; margin:-20px -20px 40px -20px; border-radius:20px 20px 0 0;"></div>
                <img id="m-photo" src="" style="width:120px; height:120px; border-radius:50%; border:5px solid #fff; margin-top:-80px; object-fit:cover;">
                <h2 id="m-name" style="margin:10px 0 5px 0;"></h2>
                <p id="m-desig" style="color:var(--primary); font-weight:bold;"></p>
                <hr>
                <div style="text-align:left; font-size:13px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div><strong>ID:</strong> <span id="m-id"></span></div>
                    <div><strong>Blood:</strong> <span id="m-blood"></span></div>
                    <div style="grid-column: span 2;"><strong>Bio:</strong> <span id="m-bio"></span></div>
                </div>
                <div id="shareSection">
                    <p style="font-size:11px; color:#666;">Scan to verify member</p>
                    <div id="qrcode"></div>
                    <small id="shareLink" style="word-break: break-all; color: var(--primary);"></small>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-download" onclick="downloadID()"><i class="fas fa-download"></i> Save Image</button>
            </div>
        </div>
    </div>

    <script>
        let membersData = [];

        function fetchMembers(file) {
            fetch(file).then(res => res.json()).then(data => {
                membersData = data;
                const list = document.getElementById('memberList');
                list.innerHTML = data.map((m, index) => `
                    <div class="member-card">
                        <div style="padding:20px; text-align:center;">
                            <img src="${m.photo}" style="width:100px; height:100px; border-radius:50%; object-fit:cover;">
                            <h3>${m.name}</h3>
                            <p style="font-size:14px; color:#777;">${m.designation}</p>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-details" onclick="openDetails(${index})">
                                <i class="fas fa-info-circle"></i> View Details
                            </button>
                            <button class="btn-action btn-share" onclick="shareMember(${index})">
                                <i class="fas fa-share-alt"></i> Share
                            </button>
                        </div>
                    </div>
                `).join('');
            });
        }

        function openDetails(index, showShare = false) {
            const m = membersData[index];
            document.getElementById('m-photo').src = m.photo;
            document.getElementById('m-name').innerText = m.name;
            document.getElementById('m-desig').innerText = m.designation;
            document.getElementById('m-id').innerText = m.id;
            document.getElementById('m-blood').innerText = m.bloodGroup;
            document.getElementById('m-bio').innerText = m.bio || 'ACMO Member';
            
            // Handle Share Section visibility
            const shareSec = document.getElementById('shareSection');
            if(showShare) {
                shareSec.style.display = 'block';
                generateQR(m.id);
            } else {
                shareSec.style.display = 'none';
            }

            document.getElementById('memberModal').style.display = 'block';
        }

        function shareMember(index) {
            openDetails(index, true);
        }

        function generateQR(memberId) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            const uniqueUrl = window.location.origin + window.location.pathname + "?id=" + memberId;
            document.getElementById('shareLink').innerText = uniqueUrl;
            
            new QRCode(qrContainer, {
                text: uniqueUrl,
                width: 100,
                height: 100
            });
        }

        function downloadID() {
            const area = document.getElementById('captureArea');
            html2canvas(area, { useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'ACMO-Member-Card.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = 'none';
        }

        window.onload = () => fetchMembers('central_members.json');
    </script>
</body>
</html>
