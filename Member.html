<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* --- Professional Modal (Full Page Look) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: #f8fafc;
            overflow-y: auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: transparent;
            margin: 0 auto;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            position: relative;
        }

        .close-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            font-size: 20px;
            color: #fff;
            background: #ef4444;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: 0.3s;
        }
        .close-btn:hover { transform: rotate(90deg); background: #dc2626; }

        /* Header Section */
        .modal-header-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            height: 220px;
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .modal-body {
            padding: 0 20px 60px;
            margin-top: -90px;
            text-align: center;
        }

        .modal-photo {
            width: 170px;
            height: 170px;
            border-radius: 25px;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: #fff;
        }

        /* Profile Info Cards */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .info-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 18px;
            text-align: left;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }

        .info-card label {
            display: block;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .info-card span {
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card i { color: #3b82f6; width: 18px; }

        .full-width-card {
            grid-column: 1 / -1;
        }

        .bio-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
            text-align: left;
            border-left: 5px solid #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* Buttons Styling */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #059669;
            color: #fff !important;
            text-decoration: none;
            padding: 16px;
            border-radius: 15px;
            margin-top: 25px;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .download-btn:hover { background: #047857; transform: translateY(-2px); }

        /* --- Share Modal Styling --- */
        #shareModal {
            display: none;
            position: fixed;
            z-index: 10002;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .share-content {
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .copy-link-box {
            display: flex;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        .copy-link-box input {
            border: none;
            background: transparent;
            width: 100%;
            padding: 0 10px;
            font-size: 13px;
            color: #475569;
            outline: none;
        }
        .copy-btn {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i>
            <p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)">
            <i class="fas fa-map-location-dot"></i>
            <p>Divisional</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('district_members.json', this)">
            <i class="fas fa-city"></i>
            <p>District</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)">
            <i class="fas fa-building"></i>
            <p>Upazila</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)">
            <i class="fas fa-bolt"></i>
            <p>Changemaker</p>
        </div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3 style="color:#1e293b; margin-bottom:15px;">Share Profile</h3>
            <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
            <div class="copy-link-box">
                <input type="text" id="shareLinkInput" readonly>
                <button class="copy-btn" onclick="copyLink()">Copy</button>
            </div>
            <button onclick="closeShare()" style="margin-top:20px; background:none; border:none; color:#64748b; cursor:pointer; font-weight:600;">Close</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column: 1/-1; padding: 50px;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Profile</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }).catch(err => {
                list.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Error loading data.</p>`;
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 20px 0 5px; font-size: 26px; color:#1e293b;">${m.name}</h2>
                <div style="display:inline-block; background:#dbeafe; color:#2563eb; padding:6px 16px; border-radius:50px; font-weight:700; font-size:13px; margin-bottom:10px;">
                    ${m.designation}
                </div>
                
                <div class="info-grid">
                    <div class="info-card">
                        <label>Member ID</label>
                        <span><i class="fas fa-id-card"></i> ${m.id}</span>
                    </div>
                    <div class="info-card">
                        <label>Blood Group</label>
                        <span><i class="fas fa-droplet" style="color:#ef4444;"></i> ${m.bloodGroup}</span>
                    </div>
                    <div class="info-card">
                        <label>Phone</label>
                        <span><i class="fas fa-phone-alt"></i> ${m.phone || 'N/A'}</span>
                    </div>
                    <div class="info-card">
                        <label>Joining Date</label>
                        <span><i class="fas fa-calendar-alt"></i> ${m.joiningDate || 'N/A'}</span>
                    </div>
                    <div class="info-card full-width-card">
                        <label>Email Address</label>
                        <span><i class="fas fa-envelope"></i> ${m.email || 'N/A'}</span>
                    </div>
                </div>

                <div class="bio-box">
                    <h4 style="margin:0 0 10px; color:#1e40af; font-size:16px;"><i class="fas fa-user-circle"></i> Short Bio</h4>
                    <p style="color:#475569; font-size:14px; line-height:1.6; margin:0;">${m.bio || 'এই সদস্য সম্পর্কে এখনো কোনো তথ্য যোগ করা হয়নি।'}</p>
                </div>

                <button class="download-btn" onclick="alert('Digital ID Card generate হচ্ছে...')">
                    <i class="fas fa-cloud-download-alt"></i> DOWNLOAD DIGITAL ID CARD
                </button>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        function openShare(id) {
            const shareUrl = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: shareUrl,
                width: 150,
                height: 150,
                colorDark : "#1e293b",
                colorLight : "#ffffff"
            });
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Copied!";
            btn.style.background = "#059669";
            setTimeout(() => {
                btn.innerText = "Copy";
                btn.style.background = "#1e293b";
            }, 2000);
        }

        function closeShare() {
            document.getElementById('shareModal').style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target.id == 'memberModal') closeModal();
            if (event.target.id == 'shareModal') closeShare();
        }

        window.onload = () => {
            fetchMembers('central_members.json', document.querySelector('.icon-btn'));
        };
    </script>
</body>
</html>
