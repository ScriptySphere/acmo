<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Modal Base Styling - Full Page Look */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: #fff; /* White background for page look */
            overflow-y: auto;
        }
        .modal-content {
            background: #fff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            position: relative;
            min-height: 100vh;
            box-shadow: none;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 30px;
            color: #fff;
            background: rgba(0,0,0,0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }

        /* Modal Body Styling */
        .modal-header-bg {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            height: 180px;
            width: 100%;
        }
        .modal-body {
            padding: 30px 20px;
            text-align: center;
            margin-top: -80px;
        }
        .modal-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        /* Card Action Buttons */
        .card-actions {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        .btn-view {
            flex: 1;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-share {
            background: #f0f2f5;
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ID Card Download Button */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 25px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }

        /* Share Modal (Small Popup) */
        #shareModal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .share-content {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }
        #qrcode {
            margin: 15px auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i>
            <p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)">
            <i class="fas fa-map-location-dot"></i>
            <p>Divisional</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('district_members.json', this)">
            <i class="fas fa-city"></i>
            <p>District</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)">
            <i class="fas fa-building"></i>
            <p>Upazila</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)">
            <i class="fas fa-bolt"></i>
            <p>Changemaker</p>
        </div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3>Share Profile</h3>
            <div id="qrcode"></div>
            <p id="shareLinkText" style="font-size: 11px; color: #666; word-break: break-all;"></p>
            <button onclick="closeShare()" class="btn-view" style="margin-top: 10px;">Close</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');

            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Details</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                list.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Error loading data.</p>`;
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 15px 0 5px 0; font-size: 24px;">${m.name}</h2>
                <p style="color:#007bff; font-weight:bold; font-size: 16px; margin:0;">${m.designation}</p>
                <div class="status-badge">${m.status || 'Active Member'}</div>
                
                <div class="info-section">
                    <div class="info-item"><label>সংগঠনের আইডি</label><span>${m.id}</span></div>
                    <div class="info-item"><label>রক্তের গ্রুপ</label><span>${m.bloodGroup}</span></div>
                    <div class="info-item"><label>পেশাগত পরিচয়</label><span>${m.profession || 'N/A'}</span></div>
                    <div class="info-item"><label>যোগদানের তারিখ</label><span>${m.joiningDate || 'N/A'}</span></div>
                    <div class="info-item"><label>ফোন</label><span>${m.phone || 'N/A'}</span></div>
                    <div class="info-item"><label>ইমেইল</label><span>${m.email || 'N/A'}</span></div>
                </div>

                <div class="bio-box">
                    <strong>সংক্ষিপ্ত বায়ো:</strong><br>
                    ${m.bio || 'সদস্য সম্পর্কে কোনো তথ্য নেই।'}
                </div>

                <a href="#" class="download-btn" onclick="alert('Generating ID Card for ID: ${m.id}')">
                    <i class="fas fa-download"></i> Download ID Card
                </a>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden"; // Disable scroll
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        // Share Logic
        function openShare(id) {
            const shareUrl = window.location.href.split('?')[0] + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkText').innerText = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: shareUrl,
                width: 128,
                height: 128
            });
        }

        function closeShare() {
            document.getElementById('shareModal').style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('memberModal')) closeModal();
            if (event.target == document.getElementById('shareModal')) closeShare();
        }

        window.onload = () => {
            fetchMembers('central_members.json', document.querySelector('.icon-btn'));
        };
    </script>
</body>
</html>
