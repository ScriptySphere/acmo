<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* --- Member Card Buttons (Updated Professional Look) --- */
        .card-actions {
            display: flex;
            gap: 12px;
            padding: 15px 20px 20px;
            background: #fff;
            border-top: 1px solid #f1f5f9;
        }

        .btn-view {
            flex: 1;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        .btn-share {
            background: #f8fafc;
            color: #64748b;
            border: 1.5px solid #e2e8f0;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-share:hover {
            background: #fff;
            color: #2563eb;
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        /* --- Full Page Profile Modal --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: #f8fafc;
            overflow-y: auto;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content {
            background: transparent;
            margin: 0 auto;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            position: relative;
        }

        .close-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            font-size: 20px;
            color: #fff;
            background: #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .modal-header-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            height: 200px;
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .modal-body {
            padding: 0 20px 50px;
            margin-top: -80px;
            text-align: center;
        }

        .modal-photo {
            width: 160px;
            height: 160px;
            border-radius: 25px;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: #fff;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .info-card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .info-card label {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .info-card span {
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card i { color: #3b82f6; }

        .bio-box {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .download-btn {
            background: #059669;
            color: #fff !important;
            padding: 16px;
            border-radius: 12px;
            margin-top: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        /* --- Share Modal --- */
        #shareModal {
            display: none;
            position: fixed;
            z-index: 10002;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .share-content {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
        }
        .copy-link-box {
            display: flex;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #e2e8f0;
        }
        .copy-btn {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i>
            <p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)"><i class="fas fa-map-location-dot"></i><p>Divisional</p></div>
        <div class="icon-btn" onclick="fetchMembers('district_members.json', this)"><i class="fas fa-city"></i><p>District</p></div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)"><i class="fas fa-building"></i><p>Upazila</p></div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)"><i class="fas fa-bolt"></i><p>Changemaker</p></div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3 style="margin-bottom:15px; color:#1e293b;">Share Profile</h3>
            <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:15px;"></div>
            <div class="copy-link-box">
                <input type="text" id="shareLinkInput" readonly style="border:none; background:transparent; width:100%; padding:5px; font-size:12px; outline:none;">
                <button class="copy-btn" onclick="copyLink()">Copy</button>
            </div>
            <button onclick="closeShare()" style="margin-top:20px; border:none; background:none; color:#64748b; cursor:pointer; font-weight:600;">Close</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column:1/-1; padding:50px;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Profile</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 15px 0 5px; font-size: 24px; color:#1e293b;">${m.name}</h2>
                <p style="color:#2563eb; font-weight:700; margin-bottom:20px;">${m.designation}</p>
                
                <div class="info-grid">
                    <div class="info-card"><label>ID Number</label><span><i class="fas fa-fingerprint"></i> ${m.id}</span></div>
                    <div class="info-card"><label>Blood Group</label><span><i class="fas fa-tint" style="color:#ef4444;"></i> ${m.bloodGroup}</span></div>
                    <div class="info-card"><label>Phone</label><span><i class="fas fa-phone"></i> ${m.phone || 'N/A'}</span></div>
                    <div class="info-card"><label>Joined</label><span><i class="fas fa-calendar-alt"></i> ${m.joiningDate || 'N/A'}</span></div>
                </div>

                <div class="info-card" style="margin-top:15px; width:100%;">
                    <label>Email</label>
                    <span><i class="fas fa-envelope"></i> ${m.email || 'N/A'}</span>
                </div>

                <div class="bio-box">
                    <h4 style="margin:0 0 10px; color:#1e40af;"><i class="fas fa-user-tag"></i> About</h4>
                    <p style="font-size:14px; color:#475569; line-height:1.6; margin:0;">${m.bio || 'সদস্য সম্পর্কে তথ্য নেই।'}</p>
                </div>

                <button class="download-btn" onclick="alert('Digital ID Card generate হচ্ছে...')">
                    <i class="fas fa-id-card"></i> DOWNLOAD IDENTITY CARD
                </button>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        function openShare(id) {
            const shareUrl = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: shareUrl, width: 140, height: 140 });
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Copied!";
            btn.style.background = "#059669";
            setTimeout(() => { btn.innerText = "Copy"; btn.style.background = "#1e293b"; }, 2000);
        }

        function closeShare() { document.getElementById('shareModal').style.display = "none"; }

        window.onclick = function(event) {
            if (event.target.id == 'memberModal') closeModal();
            if (event.target.id == 'shareModal') closeShare();
        }

        window.onload = () => fetchMembers('central_members.json', document.querySelector('.icon-btn'));
    </script>
</body>
</html>
