<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* মডাল এবং বাটনের ডিজাইন */
        .modal {
            display: none; position: fixed; z-index: 2000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            overflow-y: auto;
        }
        .modal-content {
            background: #fff; margin: 2% auto; border-radius: 20px;
            width: 90%; max-width: 450px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: modalSlide 0.4s ease-out;
        }
        @keyframes modalSlide { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; color: #fff; cursor: pointer; z-index: 100; }

        /* কার্ডের নিচের বাটন */
        .card-footer-btns { display: flex; border-top: 1px solid #eee; }
        .btn-card {
            flex: 1; padding: 12px; border: none; background: #fff;
            cursor: pointer; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s;
        }
        .btn-view { color: #007bff; border-right: 1px solid #eee; }
        .btn-share-main { color: #666; }
        .btn-card:hover { background: #f8f9fa; }

        /* আইডি কার্ড ভিউ */
        .id-card-capture { padding: 0 0 20px 0; text-align: center; }
        .modal-header-bg { background: linear-gradient(135deg, #007bff, #00c6ff); height: 100px; width: 100%; }
        .modal-body-content { padding: 0 20px; margin-top: -60px; }
        .modal-photo { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #fff; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .info-grid { text-align: left; margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid #eee; padding-top: 15px; }
        .info-item label { display: block; font-size: 10px; color: #888; text-transform: uppercase; }
        .info-item span { font-size: 13px; color: #333; font-weight: 600; }
        
        #shareArea { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; display: none; }
        #qrcode { display: flex; justify-content: center; margin: 10px 0; }
        .modal-footer-btns { padding: 15px; background: #f8f9fa; border-radius: 0 0 20px 20px; text-align: center; }
        .btn-download { background: #28a745; color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i><p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)">
            <i class="fas fa-map-location-dot"></i><p>Divisional</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)">
            <i class="fas fa-bolt"></i><p>Changemaker</p>
        </div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="captureArea" class="id-card-capture">
                <div class="modal-header-bg"></div>
                <div class="modal-body-content">
                    <img id="m-photo" src="" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                    <h2 id="m-name" style="margin: 10px 0 5px 0; color: #333;"></h2>
                    <p id="m-desig" style="color: #007bff; font-weight: bold; margin: 0;"></p>
                    <div class="info-grid">
                        <div class="info-item"><label>সংগঠনের আইডি</label><span id="m-id"></span></div>
                        <div class="info-item"><label>রক্তের গ্রুপ</label><span id="m-blood"></span></div>
                        <div class="info-item"><label>পেশা</label><span id="m-prof"></span></div>
                        <div class="info-item"><label>যোগদান</label><span id="m-join"></span></div>
                    </div>
                    <div id="shareArea">
                        <div id="qrcode"></div>
                        <p id="shareLink" style="font-size: 10px; color: #007bff; word-break: break-all;"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer-btns">
                <button class="btn-download" onclick="downloadCard()"><i class="fas fa-file-image"></i> Download ID Card</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];

        // এই ফাংশনটি এখন যেকোনো বাটনে ক্লিক করলেই কাজ করবে
        function fetchMembers(file, btn) {
            // বাটন একটিভ করা
            if(btn) {
                document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
                btn.classList.add('active');
            }

            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(res => res.json())
            .then(data => {
                allData = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    // প্রতিটি মেম্বারের জন্য বাটনসহ কার্ড জেনারেট হচ্ছে
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-footer-btns">
                                <button class="btn-card btn-view" onclick="openProfile(${index}, false)">
                                    <i class="fas fa-user-circle"></i> Details
                                </button>
                                <button class="btn-card btn-share-main" onclick="openProfile(${index}, true)">
                                    <i class="fas fa-share-nodes"></i> Share
                                </button>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                list.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Error loading data.</p>`;
            });
        }

        function openProfile(index, isSharing) {
            const m = allData[index];
            document.getElementById('m-photo').src = m.photo;
            document.getElementById('m-name').innerText = m.name;
            document.getElementById('m-desig').innerText = m.designation;
            document.getElementById('m-id').innerText = m.id;
            document.getElementById('m-blood').innerText = m.bloodGroup;
            document.getElementById('m-prof').innerText = m.profession || 'N/A';
            document.getElementById('m-join').innerText = m.joiningDate || 'N/A';

            const shareSec = document.getElementById('shareArea');
            if(isSharing) {
                shareSec.style.display = 'block';
                generateQR(m.id);
            } else {
                shareSec.style.display = 'none';
            }
            document.getElementById('memberModal').style.display = 'block';
        }

        function generateQR(id) {
            const qrBox = document.getElementById('qrcode');
            qrBox.innerHTML = "";
            const profileLink = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareLink').innerText = profileLink;
            new QRCode(qrBox, { text: profileLink, width: 100, height: 100 });
        }

        function downloadCard() {
            const area = document.getElementById('captureArea');
            html2canvas(area, { useCORS: true, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `ACMO_Card.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        function closeModal() { document.getElementById('memberModal').style.display = 'none'; }
        window.onclick = (e) => { if(e.target == document.getElementById('memberModal')) closeModal(); }

        // পেজ লোড হলে ডিফল্টভাবে সেন্ট্রাল মেম্বার দেখাবে
        window.onload = () => fetchMembers('central_members.json', document.querySelector('.icon-btn'));
    </script>
</body>
</html>
