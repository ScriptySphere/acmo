<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.13/dist/easy.qrcode.min.js"></script>

    <style>
        /* --- Member Card Buttons --- */
        .card-actions {
            display: flex;
            gap: 12px;
            padding: 15px 20px 20px;
            background: #fff;
            border-top: 1px solid #f1f5f9;
        }

        .btn-view {
            flex: 1;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 38, 38, 0.3);
        }

        .btn-share {
            background: #f8fafc;
            color: #64748b;
            border: 1.5px solid #e2e8f0;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-share:hover {
            background: #fff;
            color: #dc2626;
            border-color: #dc2626;
        }

        /* --- Full Page Profile Modal --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: #f8fafc;
            overflow-y: auto;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content {
            background: transparent;
            margin: 0 auto;
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            position: relative;
        }

        .close-btn {
            position: fixed;
            right: 20px;
            top: 20px;
            font-size: 20px;
            color: #fff;
            background: #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10001;
        }

        .modal-header-bg {
            background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
            height: 200px;
            width: 100%;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .modal-body {
            padding: 0 20px 50px;
            margin-top: -80px;
            text-align: center;
        }

        .modal-photo {
            width: 160px;
            height: 160px;
            border-radius: 25px;
            border: 6px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .info-card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        /* --- Share Modal Improvements --- */
        #shareModal {
            display: none;
            position: fixed;
            z-index: 10002;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .share-content {
            background: #fff;
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #eef2f6;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .qr-download-link {
            display: block;
            margin-top: 20px;
            background: #dc2626;
            color: #fff !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 14px;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        .qr-download-link:hover {
            background: #991b1b;
            transform: translateY(-2px);
        }

        .copy-link-box {
            display: flex;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #e2e8f0;
        }

        .download-btn {
            background: #059669;
            color: #fff !important;
            padding: 16px;
            border-radius: 12px;
            margin-top: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            width: 100%;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i><p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)"><i class="fas fa-map-location-dot"></i><p>Divisional</p></div>
        <div class="icon-btn" onclick="districtFetch('district_members.json', this)"><i class="fas fa-city"></i><p>District</p></div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)"><i class="fas fa-building"></i><p>Upazila</p></div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)"><i class="fas fa-bolt"></i><p>Changemaker</p></div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3 style="margin-bottom:15px; color:#1e293b;">Member QR Profile</h3>
            
            <div id="qrcode"></div>
            
            <div class="copy-link-box">
                <input type="text" id="shareLinkInput" readonly style="border:none; background:transparent; width:100%; padding:5px; font-size:12px; outline:none; color: #475569;">
                <button onclick="copyLink()" style="background:#1e293b; color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size: 12px; font-weight: 600;">Copy</button>
            </div>

            <div id="qrDownloadContainer"></div>

            <button onclick="closeShare()" style="margin-top:20px; border:none; background:none; color:#94a3b8; cursor:pointer; font-weight:600; font-size: 14px;">CLOSE</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            if(btn) {
                document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
                btn.classList.add('active');
            }
            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column:1/-1; padding:50px;">লোড হচ্ছে...</p>`;

            return fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Profile</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                return data;
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 15px 0 5px; font-size: 24px; color:#1e293b;">${m.name}</h2>
                <p style="color:#dc2626; font-weight:700; margin-bottom:20px;">${m.designation}</p>
                <div class="info-grid">
                    <div class="info-card"><label>সংগঠনের আইডি নম্বর</label><span><i class="fas fa-fingerprint"></i> ${m.id}</span></div>
                    <div class="info-card"><label>রক্তের গ্রুপ</label><span><i class="fas fa-tint" style="color:#ef4444;"></i> ${m.bloodGroup}</span></div>
                    <div class="info-card"><label>ফোন নম্বর</label><span><i class="fas fa-phone"></i> ${m.phone || 'N/A'}</span></div>
                    <div class="info-card"><label>যোগদানের তারিখ</label><span><i class="fas fa-calendar-alt"></i> ${m.joiningDate || 'N/A'}</span></div>
                </div>
                <button class="download-btn" onclick="alert('Digital ID Card generate হচ্ছে...')">
                    <i class="fas fa-id-card"></i> DOWNLOAD IDENTITY CARD
                </button>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        // --- Improved Share & QR Logic ---
        function openShare(id) {
            const shareUrl = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            const downloadContainer = document.getElementById('qrDownloadContainer');
            qrContainer.innerHTML = ""; 
            downloadContainer.innerHTML = "";

            // Create High-Res QR for Website View and Download
            new QRCode(qrContainer, {
                text: shareUrl,
                width: 800, // High internal resolution
                height: 800,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H,
                dotScale: 1,
                // Logo settings
                logo: "assets/images/logo.png",
                logoWidth: 200,
                logoHeight: 200,
                logoBackgroundColor: '#ffffff',
                logoBackgroundTransparent: false,
                
                onRenderingEnd: function(options, dataURL) {
                    // Create high-quality download link
                    const downloadLink = document.createElement('a');
                    downloadLink.href = dataURL;
                    downloadLink.download = `ACMO_Member_${id}_QR_HD.png`;
                    downloadLink.innerHTML = '<i class="fas fa-download"></i> Download Ultra HD QR';
                    downloadLink.className = 'qr-download-link';
                    downloadContainer.appendChild(downloadLink);
                }
            });
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert("Profile link copied!");
        }

        function closeShare() { 
            document.getElementById('shareModal').style.display = "none";
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');

            fetchMembers('central_members.json', document.querySelector('.icon-btn'))
            .then(data => {
                if (memberId) {
                    const index = data.findIndex(m => m.id === memberId);
                    if (index !== -1) openModal(index);
                }
            });
        };
    </script>
</body>
</html>
