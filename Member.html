<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - ACMO</title>
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Modal Base Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.6);
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #f8f9fa;
            margin: 20px auto;
            width: 95%;
            max-width: 500px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .close-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 24px;
            color: #fff;
            background: rgba(0,0,0,0.3);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }
        .close-btn:hover { background: #ff4757; }

        /* Professional Modal Body */
        .modal-header-bg {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            height: 140px;
            width: 100%;
        }
        .modal-body {
            padding: 0 20px 30px;
            text-align: center;
            margin-top: -70px;
        }
        .modal-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #fff;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            text-align: left;
        }
        .info-card {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .info-card label {
            display: block;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .info-card span {
            font-size: 14px;
            color: #333;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-card i { color: #007bff; width: 15px; }

        .bio-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            border-left: 4px solid #007bff;
        }

        /* Share Modal Styling */
        #shareModal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }
        .share-content {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .copy-link-box {
            display: flex;
            background: #f1f3f5;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            align-items: center;
            border: 1px solid #ddd;
        }
        .copy-link-box input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 12px;
            outline: none;
            color: #555;
        }
        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .copy-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="ACMO Logo" class="logo">
                <span class="logo-text">ACMO</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="members.html" class="nav-link active">Members</a>
                <a href="events.html" class="nav-link">Events</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="hero-overlay">
            <div class="container">
                <h1>আমাদের সদস্যরা</h1>
                <p>ACMO-র প্রতিটি সদস্য বাল্যবিবাহ প্রতিরোধে নিবেদিতপ্রাণ যোদ্ধা</p>
            </div>
        </div>
    </section>

    <div class="board-icons">
        <div class="icon-btn active" onclick="fetchMembers('central_members.json', this)">
            <i class="fas fa-shield-halved"></i>
            <p>Central Board</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('divisional_members.json', this)">
            <i class="fas fa-map-location-dot"></i>
            <p>Divisional</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('district_members.json', this)">
            <i class="fas fa-city"></i>
            <p>District</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('upazila_members.json', this)">
            <i class="fas fa-building"></i>
            <p>Upazila</p>
        </div>
        <div class="icon-btn" onclick="fetchMembers('changemaker_members.json', this)">
            <i class="fas fa-bolt"></i>
            <p>Changemaker</p>
        </div>
    </div>

    <div id="memberList" class="member-grid"></div>

    <div id="memberModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header-bg"></div>
            <div id="modalData" class="modal-body"></div>
        </div>
    </div>

    <div id="shareModal">
        <div class="share-content">
            <h3 style="margin-bottom:15px">Share Profile</h3>
            <div id="qrcode"></div>
            <div class="copy-link-box">
                <input type="text" id="shareLinkInput" readonly>
                <button class="copy-btn" onclick="copyLink()">Copy</button>
            </div>
            <button onclick="closeShare()" class="btn-view" style="margin-top: 15px; width:100%; background:#6c757d;">Close</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 All Rights Reserved | Designed by <b>Mamun</b></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        let currentMembers = [];

        function fetchMembers(file, btn) {
            document.querySelectorAll('.icon-btn').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
            const list = document.getElementById('memberList');
            list.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">লোড হচ্ছে...</p>`;

            fetch(file)
            .then(response => response.json())
            .then(data => {
                currentMembers = data;
                list.innerHTML = "";
                data.forEach((m, index) => {
                    list.innerHTML += `
                        <div class="member-card">
                            <div class="id-header">ID NO: ${m.id}</div>
                            <div class="card-body">
                                <span class="blood-group-tag">🩸 ${m.bloodGroup}</span>
                                <img src="${m.photo}" alt="${m.name}" class="member-photo" onerror="this.src='assets/images/logo.png'">
                                <h3>${m.name}</h3>
                                <p class="designation">${m.designation}</p>
                                <p class="location"><i class="fas fa-location-dot"></i> ${m.location}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-view" onclick="openModal(${index})">View Details</button>
                                <button class="btn-share" onclick="openShare('${m.id}')">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }).catch(err => {
                list.innerHTML = `<p style="color:red; text-align:center; grid-column: 1/-1;">Error loading data.</p>`;
            });
        }

        function openModal(index) {
            const m = currentMembers[index];
            const modalData = document.getElementById('modalData');
            
            modalData.innerHTML = `
                <img src="${m.photo}" class="modal-photo" onerror="this.src='assets/images/logo.png'">
                <h2 style="margin: 15px 0 5px 0; font-size: 22px; color:#333;">${m.name}</h2>
                <p style="color:#007bff; font-weight:bold; font-size: 15px; margin:0;">${m.designation}</p>
                
                <div class="info-grid">
                    <div class="info-card"><label>আইডি নং</label><span><i class="fas fa-id-badge"></i> ${m.id}</span></div>
                    <div class="info-card"><label>রক্তের গ্রুপ</label><span><i class="fas fa-droplet"></i> ${m.bloodGroup}</span></div>
                    <div class="info-card"><label>ফোন</label><span><i class="fas fa-phone"></i> ${m.phone || 'N/A'}</span></div>
                    <div class="info-card"><label>যোগদান</label><span><i class="fas fa-calendar-check"></i> ${m.joiningDate || 'N/A'}</span></div>
                </div>

                <div class="info-card" style="margin-top:15px; width:100%; box-sizing:border-box;">
                    <label>ইমেইল এড্রেস</label>
                    <span><i class="fas fa-envelope"></i> ${m.email || 'N/A'}</span>
                </div>

                <div class="bio-box">
                    <i class="fas fa-quote-left" style="color:#007bff; margin-right:5px;"></i>
                    ${m.bio || 'সদস্য সম্পর্কে কোনো তথ্য নেই।'}
                </div>

                <a href="#" class="download-btn" onclick="alert('Generating ID Card for ID: ${m.id}')">
                    <i class="fas fa-download"></i> Download ID Card
                </a>
            `;
            document.getElementById('memberModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById('memberModal').style.display = "none";
            document.body.style.overflow = "auto";
        }

        // Share & Copy Logic
        function openShare(id) {
            const shareUrl = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareModal').style.display = "flex";
            document.getElementById('shareLinkInput').value = shareUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: shareUrl,
                width: 150,
                height: 150
            });
        }

        function copyLink() {
            const copyText = document.getElementById("shareLinkInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "Copied!";
            btn.style.background = "#28a745";
            setTimeout(() => {
                btn.innerText = "Copy";
                btn.style.background = "#007bff";
            }, 2000);
        }

        function closeShare() {
            document.getElementById('shareModal').style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target.id == 'memberModal') closeModal();
            if (event.target.id == 'shareModal') closeShare();
        }

        window.onload = () => {
            fetchMembers('central_members.json', document.querySelector('.icon-btn'));
        };
    </script>
</body>
</html>
