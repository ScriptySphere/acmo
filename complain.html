<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACMO - বাল্যবিবাহ প্রতিরোধ অভিযোগ ফর্ম</title>
    <style>
        :root {
            --primary-red: #d90429;
            --dark-red: #8d0801;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --glass-shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card {
            background: var(--white);
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px var(--glass-shadow);
            border-top: 12px solid var(--primary-red);
            position: relative;
            overflow: hidden;
        }

        /* লোগো ডিজাইন */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 100px; /* লোগোর সাইজ */
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--light-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--dark-red);
            font-size: 24px;
            margin: 10px 0 5px 0;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 15px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-red);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 12px rgba(217, 4, 41, 0.15);
        }

        .submit-button {
            background: linear-gradient(45deg, var(--primary-red), var(--dark-red));
            color: white;
            padding: 18px;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.3);
            margin-top: 15px;
        }

        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(217, 4, 41, 0.5);
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .privacy-badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="form-card">
    <div class="logo-container">
        <img src="acmo.jpg" alt="ACMO Logo">
    </div>

    <div class="header">
        <h1>Anti Child Marriage Organization</h1>
        <p>আসুন বাল্যবিবাহ মুক্ত সমাজ গড়ি</p>
        <div class="privacy-badge">🔒 আপনার পরিচয় গোপন রাখা হবে</div>
    </div>

    <form action="https://formspree.io/f/xnjolvzw" method="POST">
        
        <div class="form-group">
            <label>আপনার নাম (Reporter Name):</label>
            <input type="text" name="Name" placeholder="সম্পূর্ণ নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর (Contact Number):</label>
            <input type="tel" name="Mobile" placeholder="০১XXXXXXXXX" required>
        </div>

        <div class="form-group">
            <label>ঘটনার বিস্তারিত ঠিকানা (Location):</label>
            <textarea name="Address" rows="3" placeholder="গ্রাম, থানা, জেলা..." required></textarea>
        </div>

        <div class="form-group">
            <label>অভিযোগের বিবরণ (Details):</label>
            <textarea name="Complaint" rows="3" placeholder="ঘটনাটি বিস্তারিত লিখুন..." required></textarea>
        </div>

        <div class="form-group">
            <label>সম্ভাব্য বয়স (Age Estimate):</label>
            <input type="number" name="Age" placeholder="বয়স (যদি জানা থাকে)">
        </div>

        <button type="submit" class="submit-button">অভিযোগ পাঠান</button>
    </form>

    <div class="footer">
        © 2026 Anti Child Marriage Organization (ACMO) <br>
        দেশ ও দশের সেবায় সর্বদা নিয়োজিত। Designed By <b>Mamun</b>
    </div>
</div>

</body>
</html>
